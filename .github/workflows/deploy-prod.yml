name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: 'CloudFront web URL for CORS (e.g. https://dXXXX.cloudfront.net). Leave empty for first deploy only.'
        required: false
        type: string
      first_deploy:
        description: 'Check ONLY for the very first prod deploy (skips WEB_ORIGIN requirement)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/lint.yml

  deploy:
    name: Deploy to production
    needs: validate
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.first_deploy }}" != "true" && -z "${{ inputs.web_origin }}" ]]; then
            echo "::error::WEB_ORIGIN is required for production deploys. Provide the CloudFront URL or check 'first_deploy' for initial deployment."
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        env:
          WEB_ORIGIN: ${{ inputs.web_origin }}
          FIRST_PROD_DEPLOY: ${{ inputs.first_deploy == true && 'FIRST_DEPLOY' || '' }}
        run: pnpm sst deploy --stage prod
