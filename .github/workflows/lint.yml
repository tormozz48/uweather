name: Validate

on:
  workflow_call:

jobs:
  validate:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

      - name: TypeScript build
        run: pnpm build

      - name: Run tests
        run: pnpm --filter functions test
