name: CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required so deploy-dev.yml can assume the AWS role via OIDC
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/lint.yml

  deploy-dev:
    needs: validate
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
