name: CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required so deploy-dev.yml can assume the AWS role via OIDC
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  deploy-dev:
    needs: lint
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
